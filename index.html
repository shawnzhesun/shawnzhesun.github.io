<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140d1e">
  <meta name="description" content="Shawn’s guitar studio at sunset. Look around, meet Tide of Echo, and find the records on Spotify.">
  <meta property="og:title" content="Shawn’s Studio">
  <meta property="og:description" content="Step inside. A Suhr, a Vox, three records and Tide of Echo.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://shawnzhesun.github.io/studio/assets/studio.webp">
  <title>Shawn’s Studio</title>
  <link rel="icon" href="studio/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="studio/assets/studio.webp">
  <link rel="stylesheet" href="studio/css/studio.css">
  <script type="module" src="studio/js/app.js"></script>
</head>
<body>
  <main class="room" id="room" aria-label="Shawn’s immersive guitar studio">
    <div class="backdrop" aria-hidden="true"></div>
    <h1 class="sr-only">Shawn’s Studio</h1>
    <div class="room-viewport" id="room-viewport" tabindex="0" aria-label="Studio view. Drag left or right to look around. Use arrow keys to rotate, Home to center, or Tab to explore objects.">
      <div class="scene" id="scene">
        <img id="room-image" src="studio/assets/studio.webp" width="1920" height="1080" fetchpriority="high" draggable="false" alt="A comic-style guitar studio at sunset: a charcoal-burst Suhr on a floor stand, Vox amp, pedalboard, 1176 rack, three album sleeves, the Tide of Echo wave poster, a black name badge with Shawn’s photo hanging from the desk, a dusk city outside the window, and a running terminal on the screen.">
        <canvas id="tv-live" aria-hidden="true" hidden></canvas>
        <canvas id="highlight" aria-hidden="true"></canvas>
        <div class="hotspots" id="hotspots" aria-label="Studio objects"></div>
      </div>
    </div>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="room-loading" id="room-loading" hidden><span class="loading-record"></span><span>TUNING IN</span></div>
    <div class="scene-toast" id="scene-toast" role="status"></div>
    <div class="room-hint" id="room-hint"><span class="hint-symbol" aria-hidden="true">↔</span><span>Drag to look around <i>·</i> Click to explore</span></div>
    <div class="room-controls" aria-label="Studio controls">
      <button id="explore-toggle" aria-label="Explore studio objects" title="Explore the room"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m15 9-2 4-4 2 2-4z"/></svg></button>
      <button id="reset-view" aria-label="Center camera" title="Center camera · Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 8M4 5v5h5"/><circle cx="12" cy="12" r="2"/></svg></button>
      <button id="fullscreen-toggle" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    </div>
    <nav class="object-menu" id="object-menu" aria-label="Explore the studio" hidden>
      <span class="menu-caption">FOLLOW THE SOUND</span>
      <button data-panel="badge">Say hello <span>00 ↗</span></button>
      <button data-panel="poster">Tide of Echo <span>01 ↗</span></button>
      <button data-panel="vinyl">The records <span>02 ↗</span></button>
      <button data-panel="guitar">The Suhr <span>03 ↗</span></button>
      <button data-panel="rack">The signal chain <span>04 ↗</span></button>
      <button data-panel="amp">The Vox <span>05 ↗</span></button>
      <button data-panel="pedals">The pedalboard <span>06 ↗</span></button>
      <button data-panel="tv">Command center <span>07 ↗</span></button>
    </nav>
    <section class="fallback-content" id="fallback-content" hidden><p>The room is taking a moment to tune in.</p><button id="retry-scene">Try again</button><button data-panel="poster">Meet Tide of Echo</button></section>
    <noscript><div class="no-script">Enable JavaScript to look around. <a href="https://open.spotify.com/album/2YukUrIciZZ9FmSAp3tRAm" target="_blank" rel="noopener noreferrer">Find Tide of Echo ↗</a></div></noscript>
  </main>
  <dialog id="detail-dialog" aria-labelledby="panel-title"><button class="close-panel" id="close-panel" aria-label="Close details">×</button><div id="panel-content"></div></dialog>
  <div class="sr-only" role="status" id="announcer"></div>
</body>
</html>
